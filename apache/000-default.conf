<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html/MetGENE>
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule ^/$ /MetGENE/ [R,L]
    RewriteRule ^/MetGENE/rest/([^/]+)/species/([^/]+)/GeneIDType/([^/]+)/GeneInfoStr/([^/]+)/anatomy/([^/]+)/disease/([^/]+)/phenotype/([^/]+)/viewType/([^/]+)/?$ /MetGENE/$1.php?species=$2&GeneIDType=$3&GeneInfoStr=$4&anatomy=$5&disease=$6&phenotype=$7&viewType=$8 [L,QSA]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
